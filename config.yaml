model_list:
  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://evren-llmapi.ssyz.org.tr/v1
      api_key: os.environ/EVREN_API_KEY

  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: https://evren-llmapi.ssyz.org.tr/v1
      api_key: os.environ/EVREN_API_KEY

  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/qwen3.8-flash-next
      api_base: https://evren-llmapi.ssyz.org.tr/v1
      api_key: os.environ/EVREN_API_KEY

litellm_settings:
  # Claude Code'un gönderdiği Anthropic'e özgü parametreleri (thinking vb.) düşürür.
  drop_params: true
  # glm-5.3 kuyrukta uzun bekleyebiliyor (3 dk+). Erken kesmemek için yüksek.
  request_timeout: 600
  # LiteLLM, üzerinden istek klasik chat/completions biçiminde gider 
  use_chat_completions_url_for_anthropic_messages: true
